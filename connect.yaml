http:
  address: 0.0.0.0:4195
  debug_endpoints: true

logger:
  level: INFO
  format: json
  add_timestamp: true

metrics:
  prometheus: {}

input:
  kafka:
    addresses:
      - ${KAFKA_BROKERS:redpanda:9092}
    topics:
      - ${RELATIONSHIP_TOPIC:ripple.relationship.public.relationships}
    consumer_group: ${CONSUMER_GROUP:memgraph-loader}
    start_from_oldest: true
    checkpoint_limit: 1

pipeline:
  processors:
    - label: drop_tombstones
      mapping: |
        root = if content().length() == 0 { deleted() } else { this }
    - label: normalize_debezium
      mapping: |
        let env = if this.payload != null { this.payload } else { this }
        let cdc_op = $env.get("op").or("")
        let row = if $cdc_op == "d" { $env.before } else { $env.after.or($env.before) }
        let t = $row.target_entity_type.or("").string().lowercase()
        let target_label = match $t {
          "analysis" => "Analysis"
          "report" => "Report"
          "query" => "Query"
          "dataset" => "Dataset"
          "workflow" => "Workflow"
          "pipeline_run" => "PipelineRun"
          _ => "Artifact"
        }
        let props = $row.properties
        let confidence = if $props.type() == "string" {
          $props.parse_json().confidence.or(1.0)
        } else {
          $props.confidence.or(1.0)
        }
        root.cdc_op = $cdc_op
        root.target_label = $target_label
        root.row = $row
        root.params = {
          "source_id": $row.source_entity_id.string(),
          "source_type": $row.source_entity_type.string(),
          "source_name": $row.source_entity_name.string(),
          "target_id": $row.target_entity_id.string(),
          "target_type": $row.target_entity_type.string(),
          "target_name": $row.target_entity_name.string(),
          "relationship_id": $row.relationship_id.string(),
          "knowledge_source": $row.knowledge_source.string(),
          "knowledge_entity_id": $row.knowledge_entity_id.string(),
          "knowledge_entity_type": $row.knowledge_entity_type.string(),
          "knowledge_version": $row.knowledge_version.string(),
          "first_observed_at": $row.first_observed_at.string(),
          "last_observed_at": $row.last_observed_at.string(),
          "detection_id": $row.detection_id.string(),
          "lineage_id": $row.lineage_id.string(),
          "confidence": $confidence
        }
        root.cypher = if $cdc_op == "d" {
          "MATCH (:BiologicalEntity)-[rel:DETECTED_IN {relationship_id: $relationship_id}]->() DELETE rel"
        } else {
          "MERGE (source:BiologicalEntity {id: $source_id}) SET source.type = $source_type, source.name = $source_name MERGE (target:" + $target_label + " {id: $target_id}) SET target.type = $target_type, target.name = $target_name MERGE (source)-[rel:DETECTED_IN {relationship_id: $relationship_id}]->(target) SET rel.knowledge_source = $knowledge_source, rel.knowledge_entity_id = $knowledge_entity_id, rel.knowledge_entity_type = $knowledge_entity_type, rel.knowledge_version = $knowledge_version, rel.first_observed_at = $first_observed_at, rel.last_observed_at = $last_observed_at, rel.detection_id = $detection_id, rel.lineage_id = $lineage_id, rel.confidence = $confidence"
        }
    - label: apply_cypher
      subprocess:
        name: python3
        args: ["-u", "/usr/local/bin/apply_cypher.py"]
        codec_send: lines
        codec_recv: lines
        max_buffer: 262144

output:
  drop: {}
