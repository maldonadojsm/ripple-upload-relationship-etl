# --------------------------------------------------
# SINK (Kafka protocol → Redpanda)
# --------------------------------------------------
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=${REDPANDA_BROKERS}
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.retries=2147483647
debezium.sink.kafka.producer.max.in.flight.requests.per.connection=1
debezium.sink.kafka.producer.delivery.timeout.ms=2147483647
debezium.sink.kafka.producer.request.timeout.ms=30000
debezium.sink.kafka.producer.max.block.ms=60000
debezium.sink.kafka.wait.message.delivery.timeout.ms=120000

# --------------------------------------------------
# SOURCE (PostgreSQL logical decoding)
# --------------------------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=${DEBEZIUM_USER}
debezium.source.database.password=${DEBEZIUM_PASSWORD}
debezium.source.database.dbname=${POSTGRES_DB}
debezium.source.topic.prefix=${DEBEZIUM_TOPIC_PREFIX}
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=ripple_relationship
debezium.source.publication.name=ripple_relationship
debezium.source.publication.autocreate.mode=disabled
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.relationships
debezium.source.snapshot.mode=initial
debezium.source.slot.drop.on.stop=false
debezium.source.tombstones.on.delete=false

# --------------------------------------------------
# OFFSET STORAGE (file, not Kafka Connect topics)
# --------------------------------------------------
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# --------------------------------------------------
# SERIALIZATION (standard Debezium envelope, no unwrap SMT)
# --------------------------------------------------
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# --------------------------------------------------
# QUARKUS
# --------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."io.debezium".level=INFO
quarkus.http.port=8080
