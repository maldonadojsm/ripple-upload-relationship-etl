http:
  address: 0.0.0.0:4195

logger:
  level: INFO
  format: json

input:
  sql_select:
    driver: postgres
    dsn: ${POSTGRES_DSN:postgres://ripple:ripple@postgres:5432/ripple?sslmode=disable}
    table: relationships
    columns:
      - relationship_id
      - relationship_type
      - source_entity_id
      - source_entity_type
      - source_entity_name
      - target_entity_id
      - target_entity_type
      - target_entity_name
      - detection_id
      - lineage_id
      - knowledge_source
      - knowledge_entity_id
      - knowledge_entity_type
      - knowledge_version
      - properties
      - first_observed_at
      - last_observed_at

pipeline:
  processors:
    - mapping: |
        let t = this.target_entity_type.or("").string().lowercase()
        let target_label = match $t {
          "analysis" => "Analysis"
          "report" => "Report"
          "query" => "Query"
          "dataset" => "Dataset"
          "workflow" => "Workflow"
          "pipeline_run" => "PipelineRun"
          _ => "Artifact"
        }
        let props = this.properties
        let confidence = if $props.type() == "string" {
          $props.parse_json().confidence.or(1.0)
        } else {
          $props.confidence.or(1.0)
        }
        root.params = {
          "source_id": this.source_entity_id.string(),
          "source_type": this.source_entity_type.string(),
          "source_name": this.source_entity_name.string(),
          "target_id": this.target_entity_id.string(),
          "target_type": this.target_entity_type.string(),
          "target_name": this.target_entity_name.string(),
          "relationship_id": this.relationship_id.string(),
          "knowledge_source": this.knowledge_source.string(),
          "knowledge_entity_id": this.knowledge_entity_id.string(),
          "knowledge_entity_type": this.knowledge_entity_type.string(),
          "knowledge_version": this.knowledge_version.string(),
          "first_observed_at": this.first_observed_at.string(),
          "last_observed_at": this.last_observed_at.string(),
          "detection_id": this.detection_id.string(),
          "lineage_id": this.lineage_id.string(),
          "confidence": $confidence
        }
        root.cypher = "MERGE (source:BiologicalEntity {id: $source_id}) SET source.type = $source_type, source.name = $source_name MERGE (target:" + $target_label + " {id: $target_id}) SET target.type = $target_type, target.name = $target_name MERGE (source)-[rel:DETECTED_IN {relationship_id: $relationship_id}]->(target) SET rel.knowledge_source = $knowledge_source, rel.knowledge_entity_id = $knowledge_entity_id, rel.knowledge_entity_type = $knowledge_entity_type, rel.knowledge_version = $knowledge_version, rel.first_observed_at = $first_observed_at, rel.last_observed_at = $last_observed_at, rel.detection_id = $detection_id, rel.lineage_id = $lineage_id, rel.confidence = $confidence"
    - subprocess:
        name: python3
        args: ["-u", "/usr/local/bin/apply_cypher.py"]
        codec_send: lines
        codec_recv: lines
        max_buffer: 262144

output:
  drop: {}
